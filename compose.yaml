services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chess_trainer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chess-db-data:/var/lib/postgresql/data
      - ./chess-backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  chess-db-data: